<!DOCTYPE html>
<html>
<head>
    <title>Data Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Predicted Data Results</h2>
        <a href="/" class="btn btn-secondary">Volver a subir</a>
    </div>
    
    <div class="table-responsive">
        {{ table_html | safe }}
    </div>

    <script>
        // Añadir clases de Bootstrap dinámicamente si Pandas no las puso todas
        document.querySelector('table').classList.add('table', 'table-hover', 'table-bordered');
    </script>
</body>
</html>
